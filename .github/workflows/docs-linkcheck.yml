# Weekly check that the links in the docs still resolve. External sites go down or move,
# so this runs on a schedule instead of on every push; a failure means a link to fix.

name: Docs link check

on:
  schedule:
    - cron: "17 14 * * 1"  # Mondays, 14:17 UTC
  workflow_dispatch:  # allow manual triggering of the workflow

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # docs/source/conf.py reads mejiro's version from git tags
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install graphviz
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz
    - name: Install docs requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
    - name: Check links
      run: |
        sphinx-build -b linkcheck docs/source docs/build/linkcheck
