# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
    paths:
      - "mejiro/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/python-app.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "mejiro/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/python-app.yml"
  workflow_dispatch:  # allow manual triggering of the workflow

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history and tags, so setuptools-scm can work out mejiro's version
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev,roman]"
    - name: Test with pytest
      run: |
        pytest -v --ignore tests/test_hwo_imaging --ignore tests/test_engines/test_galsim_engine_hwo.py --ignore tests/test_instruments/test_hwo.py

  docs:
    # Builds the docs the way Read the Docs does (readthedocs.yaml): docs requirements only,
    # Python 3.12, graphviz for the module diagram. Warnings fail the build.
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # docs/source/conf.py reads mejiro's version from git tags
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install graphviz
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz
    - name: Install docs requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
    - name: Build docs
      run: |
        sphinx-build -W --keep-going docs/source docs/build
