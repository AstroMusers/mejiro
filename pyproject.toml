[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mejiro"
description = "Pipeline to simulate diffraction-limited telescope images of strong gravitational lenses"
dynamic = ["version"]
authors = [
    { name = "Bryce Wedig", email = "b.t.wedig@wustl.edu" },
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "astropy==8.0.2",
    "galsim==2.8.5",
    "numpy<2.4.0",  # required by slsim, which still uses np.trapz (removed in numpy 2.4.0)
    "pandas==3.1.0",
    "tqdm==4.70.1",
    "lenstronomy==1.14.2",
    "pyhalo==1.5.2",
    "mcfit==0.0.22",  # required for pyhalo
    "slsim @ git+https://github.com/bryce-wedig/slsim.git@9b019373a3ed06144c0fef06fa7a6515a427f468",
    "sncosmo==2.13.1",  # required for slsim
    "speclite @ git+https://github.com/bryce-wedig/speclite.git@mejiro",  # required for slsim
    "skypy @ git+https://github.com/bryce-wedig/skypy.git@mejiro",  # required for slsim
    "colossus==1.4.0",  # required for slsim
    "corner==2.3.0",
    "jax",
    "jaxtronomy",  # required for slsim
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "jupyter",
    "sphinx",
    "sphinx-rtd-theme",
    "pydeps",
]
jax-gpu = [
    "jax[cuda12]",
]
roman = [
    "stpsf==2.3.0",
    "romanisim==0.14.0",
    "romancal==1.1.0",
    "roman-technical-information==1.5.0",
]
hwo = [
    "syotools==1.3.5"
]
all = [
    "mejiro[dev,jax-gpu,roman,hwo]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mejiro*"]

[tool.setuptools.dynamic]
version = {attr = "mejiro.__version__"}

[project.urls]
Documentation = "https://mejiro.readthedocs.io/en/latest/index.html"
Repository = "https://github.com/AstroMusers/mejiro"
Issues = "https://github.com/AstroMusers/mejiro/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "."
]

[tool.coverage.run]
source = ["mejiro"]
omit = [
    "mejiro/pipeline/*",
    "mejiro/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
precision = 1

[tool.coverage.html]
directory = "htmlcov"
