[build-system]
requires = ["setuptools", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mejiro"
description = "Pipeline to simulate diffraction-limited telescope images of strong gravitational lenses"
dynamic = ["version"]
authors = [
    { name = "Bryce Wedig", email = "b.t.wedig@wustl.edu" },
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "astropy==8.0.2",
    "galsim==2.8.5",
    "numpy<2.4.0",  # slsim and pyhalo 1.4.6 still use np.trapz, removed in numpy 2.4.0
    "pandas==3.1.1",
    "tqdm==4.70.1",
    "lenstronomy==1.14.3",
    "pyhalo==1.4.6",  # 1.4.7+ imports lenstronomy profiles (core_collapsed_halo, king) that no lenstronomy release has yet
    "mcfit==0.0.22",  # required for pyhalo
    "slsim @ git+https://github.com/bryce-wedig/slsim.git@ab4faf673b9b7fa413957138758382ba9d0302b4",
    "sncosmo==2.13.1",  # required for slsim
    "speclite @ git+https://github.com/bryce-wedig/speclite.git@mejiro",  # required for slsim
    "skypy @ git+https://github.com/bryce-wedig/skypy.git@mejiro",  # required for slsim
    "colossus==1.4.0",  # required for slsim
    "corner==2.3.0",
    "jax",
    "jaxtronomy",  # required for slsim
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "jupyter",
    "sphinx",
    "sphinx-rtd-theme",
    "pydeps",
    "import-linter==2.15",
]
jax-gpu = [
    "jax[cuda12]",
]
roman = [
    "stpsf==2.3.0",
    "pysiaf>=0.24",  # imported directly by mejiro/point_wfi.py; stpsf also requires >=0.24
    "romanisim==0.14.0",
    "romancal==1.1.0",
    "roman-technical-information==1.5.0",
    "astrocut==1.4.0",
]
hwo = [
    "syotools==1.3.5"
]
all = [
    "mejiro[dev,jax-gpu,roman,hwo]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mejiro*"]

[tool.setuptools_scm]
# The version comes from the latest git tag (e.g. v3.0.0) plus the commits since it,
# e.g. 3.0.1.dev12+g1a2b3c4 between releases. It's written to mejiro/_version.py at install.
version_file = "mejiro/_version.py"

[tool.importlinter]
# The import rules. docs/source/appendices/structure.rst states them in words: keep the two in sync.
# Run `lint-imports` from the repository root. Imports inside functions count; importlib calls can't
# be seen.
root_package = "mejiro"
include_external_packages = true  # the one-backend contracts name third-party packages

[[tool.importlinter.contracts]]
id = "layers"
name = "Modules import only from their own layer or lower ones"
type = "layers"
containers = ["mejiro"]
exhaustive = true  # every new top-level module has to be given a layer here
exhaustive_ignores = ["_version"]
layers = [
    "pipeline",
    "exposure : galaxy_galaxy : lensed_supernova : plots : point_wfi : strong_lens : style : synthetic_image",
    "instruments",
    "engines : analysis : cosmo",
    "utils",
]

[[tool.importlinter.contracts]]
id = "engines-independent"
name = "Engines don't import each other"
type = "independence"
modules = [
    "mejiro.engines.galsim_engine",
    "mejiro.engines.lenstronomy_engine",
    "mejiro.engines.pandeia_engine",
    "mejiro.engines.stpsf_engine",
]

[[tool.importlinter.contracts]]
id = "instruments-independent"
name = "Instruments don't import each other"
type = "independence"
modules = [
    "mejiro.instruments.hwo",
    "mejiro.instruments.jwst",
    "mejiro.instruments.roman",
]

[[tool.importlinter.contracts]]
id = "galsim-engine-backend"
name = "galsim_engine imports no other engine's backend"
type = "forbidden"
source_modules = ["mejiro.engines.galsim_engine"]
forbidden_modules = ["lenstronomy", "pandeia", "stpsf"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "lenstronomy-engine-backend"
name = "lenstronomy_engine imports no other engine's backend"
type = "forbidden"
source_modules = ["mejiro.engines.lenstronomy_engine"]
forbidden_modules = ["galsim", "pandeia", "stpsf"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "pandeia-engine-backend"
name = "pandeia_engine imports no other engine's backend"
type = "forbidden"
source_modules = ["mejiro.engines.pandeia_engine"]
# lenstronomy is left out on purpose: this engine uses it for magnitude conversions and Roman's
# zeropoints. The exception goes away if the engine is removed or those move elsewhere.
forbidden_modules = ["galsim", "stpsf"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "stpsf-engine-backend"
name = "stpsf_engine imports no other engine's backend"
type = "forbidden"
source_modules = ["mejiro.engines.stpsf_engine"]
forbidden_modules = ["galsim", "lenstronomy", "pandeia"]
allow_indirect_imports = true

[project.urls]
Documentation = "https://mejiro.readthedocs.io/en/latest/index.html"
Repository = "https://github.com/AstroMusers/mejiro"
Issues = "https://github.com/AstroMusers/mejiro/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "."
]

[tool.coverage.run]
source = ["mejiro"]
omit = [
    "mejiro/pipeline/*",
    "mejiro/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
precision = 1

[tool.coverage.html]
directory = "htmlcov"
