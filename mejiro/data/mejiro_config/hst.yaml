# HST WFC3/UVIS. Supports steps 01a, 01b, 02, 04 and 05_galsim: there's no step 03 for HST, so run
# step 04 with --prev-step 02. Pipeline.run() is Roman-only, so run the steps one at a time.
data_dir: &data_dir null  # where output data should be written
pipeline_label: hst
psf_cache_dir: null  # HST PSFs are Gaussians, so nothing is cached
dev: True
nice: 19
show_progress_bar: True
logging_level: WARNING
limit: null
seed: &seed 42
cores:
  script_01a: 1
  script_01b: 1
  script_04: 1
  script_05_galsim: 1
jaxtronomy:
  use_jax: False
  jax_platform: cpu  # cpu or gpu
instrument: hst
survey:
  runs: 1
  num_galaxy_tables: 1  # number of independent galaxy tables for _01a; higher = more intrinsic diversity
  speed_factor: 1  # set >1 for faster but less complete population draws in _01b
  area: 0.1  # must match fsky in the SkyPy config
  skypy_config: hst
  write_to_csv: True
  total_population: True
  use_real_sources: False
  use_slhammocks_pipeline: False
  detectors: [1]  # HST has one detector
  bands: [F438W, F475W, F606W, F814W]  # SkyPy will calculate magnitudes for each of these bands; they'll be stored in the physical_params attribute of the strong_lens
  deflector_cut_band: F814W
  deflector_cut_band_max: 25
  deflector_z_min: 0.01
  deflector_z_max: 2.0
  source_cut_band: F814W
  source_cut_band_max: 27
  source_z_min: 0.01
  source_z_max: 3.0
  min_image_separation: 0.3  # arcseconds
  max_image_separation: 10.0  # arcseconds
  mag_arc_limit_band: F814W
  mag_arc_limit: 26
  magnification: 2
synthetic_image:
  bands: [F606W, F814W]
  fov_arcsec: 5
  supersampling_compute_mode: regular  # adaptive does not work with Gaussian PSFs
  supersampling_factor: &supersampling_factor 1
  pieces: True
  serialization: full
imaging:
  exposure_time: &exposure_time 2000
  engine: galsim
  serialization: lightweight  # Exposure OUTPUT format: lightweight -> compact .npz (data + pieces + metadata); full -> whole-object pickle
  engine_params:
    rng_seed: *seed
    sky_background: True
    detector_effects: True
    poisson_noise: True
    dark_noise: True
    read_noise: True
snr:
  snr_band: F814W
  snr_exposure_time: *exposure_time
  snr_fov_arcsec: 5
  snr_supersampling_compute_mode: regular  # adaptive does not work with Gaussian PSFs
  snr_supersampling_factor: &snr_supersampling_factor 1
  snr_threshold: 10
  snr_per_pixel_threshold: 1
psf:
  num_pixes: [101]  # not used by HST's Gaussian PSFs, but steps 01b and 04 read it
