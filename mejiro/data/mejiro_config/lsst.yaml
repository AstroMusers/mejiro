# Rubin LSST, 10-year depth. Supports steps 01a, 01b, 02, 04 and 05_galsim: there's no step 03 for
# LSST, so run step 04 with --prev-step 02. Pipeline.run() is Roman-only, so run the steps one at a time.
data_dir: &data_dir null  # where output data should be written
pipeline_label: lsst
psf_cache_dir: null  # LSST PSFs are Gaussians, so nothing is cached
dev: True
nice: 19
show_progress_bar: True
logging_level: WARNING
limit: null
seed: &seed 42
cores:
  script_01a: 1
  script_01b: 1
  script_04: 1
  script_05_galsim: 1
jaxtronomy:
  use_jax: False
  jax_platform: cpu  # cpu or gpu
instrument: lsst
survey:
  runs: 1
  num_galaxy_tables: 1  # number of independent galaxy tables for _01a; higher = more intrinsic diversity
  speed_factor: 1  # set >1 for faster but less complete population draws in _01b
  area: 1.0  # must match fsky in the SkyPy config
  skypy_config: lsst
  write_to_csv: True
  total_population: True
  use_real_sources: False
  use_slhammocks_pipeline: False
  detectors: [1]  # LSST is simulated as one detector
  bands: [u, g, r, i, z, y]  # SkyPy will calculate magnitudes for each of these bands; they'll be stored in the physical_params attribute of the strong_lens
  deflector_cut_band: i
  deflector_cut_band_max: 24
  deflector_z_min: 0.01
  deflector_z_max: 2.0
  source_cut_band: i
  source_cut_band_max: 26
  source_z_min: 0.01
  source_z_max: 3.0
  min_image_separation: 0.5  # arcseconds
  max_image_separation: 10.0  # arcseconds
  mag_arc_limit_band: i
  mag_arc_limit: 25
  magnification: 2
synthetic_image:
  bands: [g, r, i]
  fov_arcsec: 10
  supersampling_compute_mode: regular  # adaptive does not work with Gaussian PSFs
  supersampling_factor: &supersampling_factor 1
  pieces: True
  serialization: full
imaging:
  exposure_time: &exposure_time 13800  # 460 30-second visits, about 10 years in i
  engine: galsim
  serialization: lightweight  # Exposure OUTPUT format: lightweight -> compact .npz (data + pieces + metadata); full -> whole-object pickle
  engine_params:
    rng_seed: *seed
    sky_background: True
    detector_effects: True
    poisson_noise: True
    dark_noise: True
    read_noise: True
snr:
  snr_band: i
  snr_exposure_time: *exposure_time
  snr_fov_arcsec: 10
  snr_supersampling_compute_mode: regular  # adaptive does not work with Gaussian PSFs
  snr_supersampling_factor: &snr_supersampling_factor 1
  snr_threshold: 10
  snr_per_pixel_threshold: 1
psf:
  num_pixes: [101]  # not used by LSST's Gaussian PSFs, but steps 01b and 04 read it
